<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="styl.css">
</head>
<style>
    *
{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.card
{

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
 
}
#img1
{
    width: 200px;
    height: 200px;
    border-radius: 500%;
    object-fit: cover;
    border: 3px solid #ddd;
}

h1
{
    color: rgb(255, 255, 255);
    font-size: 36px;
    margin: 25px 0.15px;
}

p{  
    color: rgb(255, 255, 255);
    font-size: 18px;
}


.login
{
    padding: 20px;
    background-color: rgb(15, 17, 60);
    border-radius: 30px;
    box-shadow: 0 2px 6px rgba(8, 200, 214, 0);
    gap: 20px;

}
.login input,.login select, .login button
{
    width: 100%;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 2px 6px rgba(106, 173, 246, 0.911);
    margin: 15px 3px 0;

}


</style>
<body>
    <section>
        <div class = "card">
            <div class ="login">
                <img src="./pic (3).png" id = "img1" >

                <h1>Justine Belen</h1>
                  <p id = "Type"></p> </p>
                <p>BS Computer Science</p>
                <input type="text" placeholder="Type your nickname" id = ID>
             <br>
                <select>
                    <option value = "" disabled selected>Course</option> 
                    <option>1st year</option>
                    <option>2nd year</option>
                    <option>3rd year</option>
                    <option>4st year</option>
                </select>
            <br>
            <button id = "btn1">Click</button>
            <button id = "btn2">Double Click</button>
            <button id = "btn2">Press & Hold</button>
        </div>    
        </div>
    </section>

    <script src = "script.js"></script>
</body>
</html>
